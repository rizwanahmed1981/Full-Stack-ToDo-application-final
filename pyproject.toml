[project]
name = "todo-app"
version = "0.1.0"
description = "A persistent todo application with PostgreSQL backend"
authors = [
    {name = "Developer", email = "developer@example.com"}
]
dependencies = [
    "fastapi>=0.104.1",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.24.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.12.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psycopg[binary]>=3.3.2",
    "httpx>=0.28.1",
]
readme = "README.md"
requires-python = ">=3.14"

[project.scripts]
todo-app = "todo_app.cli.main:app"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
